<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منظومة إدارة العيادة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0f9b8e;
  --primary-2:#12b3a4;
  --primary-dark:#0a7a70;
  --bg:#f2f7fa;
  --card:#ffffff;
  --text:#1f2d3a;
  --muted:#7a8b9a;
  --border:#e3edf3;
  --danger:#e2504c;
  --warn:#f0a53a;
  --ok:#25a86b;
  --shadow:0 6px 24px rgba(15,90,120,.08);
  --radius:14px;
}
html,body{height:100%}
body{
  font-family:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;
  background:var(--bg);color:var(--text);direction:rtl;font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.hidden{display:none !important}
a{cursor:pointer;text-decoration:none;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c6d9e2;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============ Buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;
  padding:10px 16px;cursor:pointer;font-weight:700;font-size:13.5px;transition:.18s;
  background:#eef4f7;color:var(--text);white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 6px 16px rgba(15,155,142,.28)}
.btn.primary:hover{box-shadow:0 8px 20px rgba(15,155,142,.38)}
.btn.ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{background:#f7fbfc}
.btn.danger{background:#fdecec;color:#c0392b}
.btn.danger:hover{background:#f9dcdc}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.tiny{padding:4px 10px;font-size:12px;border-radius:8px;background:#eaf6f4;color:var(--primary-dark);font-weight:700}
.btn.tiny:hover{background:#d9f0ec}
.btn.block{width:100%}
.icon-btn{background:transparent;border:none;cursor:pointer;color:var(--muted);border-radius:8px;padding:5px;display:inline-flex;transition:.15s}
.icon-btn:hover{background:#f0f5f8;color:var(--text)}
.icon-btn.danger:hover{background:#fdecec;color:var(--danger)}

/* ============ Auth screens ============ */
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#0b6b76 0%,#12b3a4 55%,#63d6c8 100%);
}
.auth-card{
  width:100%;max-width:440px;background:#fff;border-radius:20px;padding:34px 30px;
  box-shadow:0 24px 70px rgba(0,50,60,.28);animation:pop .35s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.auth-logo{
  width:58px;height:58px;border-radius:16px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:28px;font-weight:800;
  box-shadow:0 8px 20px rgba(15,155,142,.35);
}
.auth-card h1{font-size:20px;text-align:center;margin-bottom:4px}
.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.auth-form{display:flex;flex-direction:column;gap:13px}
.auth-err{color:var(--danger);font-size:13px;min-height:18px;text-align:center;font-weight:600}
.auth-note{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}

/* ============ Fields ============ */
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3c5b63}
.field span{font-size:12.5px;color:#4a6b74}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fbfdfe;
  font-weight:500;color:var(--text);transition:.16s;font-size:13.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(15,155,142,.12);
}
.field textarea{resize:vertical;min-height:70px;line-height:1.7}
.hint{font-size:11.5px;color:var(--muted);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}

/* ============ Layout ============ */
#app{display:flex;min-height:100vh}
.sidebar{
  width:262px;background:linear-gradient(180deg,#0a4048 0%,#0f6b74 100%);color:#dff3f4;
  position:fixed;top:0;bottom:0;right:0;display:flex;flex-direction:column;z-index:60;
  transition:transform .26s ease;box-shadow:-4px 0 24px rgba(0,40,50,.14);
}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand-logo{
  width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.15);font-size:22px;flex-shrink:0;
}
.brand-name{font-size:15px;font-weight:800;color:#fff;line-height:1.3}
.brand-sub{font-size:11px;color:#9fd6d5}
.nav{flex:1;overflow-y:auto;padding:12px 0}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 16px;margin:3px 12px;border-radius:10px;
  color:#cfe9ea;font-weight:600;font-size:13.5px;transition:.18s;cursor:pointer;user-select:none;
}
.nav-item:hover{background:rgba(255,255,255,.09);color:#fff}
.nav-item.active{background:rgba(255,255,255,.17);color:#fff;box-shadow:inset -3px 0 0 #7fe3d5}
.nav-item svg{flex-shrink:0}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#9fd6d5;text-align:center}

.main{flex:1;margin-right:262px;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:14px;
}
.topbar-title{font-weight:800;font-size:16px;flex:1}
.topbar-user{font-size:12.5px;color:var(--muted);font-weight:600}
.menu-btn{display:none}
#content{padding:22px 24px 60px;max-width:1400px;width:100%;margin:0 auto}

@media(max-width:960px){
  .sidebar{transform:translateX(105%)}
  .sidebar.open{transform:none}
  .main{margin-right:0}
  .menu-btn{display:inline-flex}
  #content{padding:16px 14px 60px}
  .topbar{padding:10px 14px}
}

/* ============ Cards & page head ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:19px;font-weight:800}
.page-head p{font-size:12.5px;color:var(--muted)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;
  margin-bottom:18px;border:1px solid #eaf2f6;
}
.card-title{font-size:14.5px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.pre{white-space:pre-wrap;line-height:1.9;font-size:13.5px}
.empty{padding:34px 14px;text-align:center;color:var(--muted);font-size:13px}
.sec-title{font-size:13.5px;font-weight:800;color:var(--primary-dark);margin:6px 0 12px;padding-bottom:8px;border-bottom:1.5px dashed var(--border)}

/* ============ Stats ============ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
  border:1px solid #eaf2f6;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;transition:.2s;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,90,120,.12)}
.stat-ico{
  width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:#e8f7f5;color:var(--primary-dark);
}
.stat-ico.blue{background:#e9f0ff;color:#2f6fed}
.stat-ico.orange{background:#fff3e2;color:#d9861a}
.stat-ico.purple{background:#f3ecff;color:#7b4fd6}
.stat-ico.pink{background:#ffeaf2;color:#d63a76}
.stat-ico.green{background:#e8f8ef;color:#1f9d61}
.stat-val{font-size:23px;font-weight:800;line-height:1.1}
.stat-lbl{font-size:12px;color:var(--muted);font-weight:600}

.mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.mini{background:#f6fbfb;border:1px solid #e6f2f1;border-radius:11px;padding:11px;text-align:center}
.mini b{display:block;font-size:19px;color:var(--primary-dark)}
.mini span{font-size:11.5px;color:var(--muted);font-weight:600}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.mstat{background:#f8fcfd;border:1px solid #e8f2f5;border-radius:11px;padding:12px;text-align:center}
.mstat b{display:block;font-size:17px;color:var(--text)}
.mstat span{font-size:11.5px;color:var(--muted);font-weight:600}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.bar-name{width:120px;flex-shrink:0;color:#3c5b63;font-weight:600}
.bar-track{flex:1;height:9px;background:#eef5f7;border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--primary-2),var(--primary));transition:width .4s}
.bar-val{width:34px;text-align:left;font-weight:800;color:var(--primary-dark)}

/* ============ Tables ============ */
.table-wrap{overflow-x:auto;border-radius:10px}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{background:#f3f9fa;color:#3c5b63;font-weight:800;text-align:right;padding:11px 12px;border-bottom:2px solid var(--border);white-space:nowrap;font-size:12.5px}
.table td{padding:10px 12px;border-bottom:1px solid #eef4f6;vertical-align:middle}
.table tbody tr:hover{background:#f8fcfc}
.table tbody tr:last-child td{border-bottom:none}
.row-actions{display:flex;gap:4px}

/* ============ Toolbar ============ */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input[type=date]{
  padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fbfdfe;font-weight:600;font-size:13px;
}
.toolbar select:focus,.toolbar input:focus{outline:none;border-color:var(--primary);background:#fff}
.search-box{
  display:flex;align-items:center;gap:8px;background:#fbfdfe;border:1.5px solid var(--border);border-radius:10px;
  padding:0 12px;flex:1;min-width:200px;color:var(--muted);
}
.search-box input{border:none;background:transparent;padding:10px 0;flex:1;font-weight:500;outline:none}

/* ============ Profile ============ */
.profile-head{display:flex;align-items:center;gap:14px}
.avatar{
  width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:24px;font-weight:800;flex-shrink:0;
  box-shadow:0 8px 18px rgba(15,155,142,.28);
}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.chip{
  background:#eef7f7;color:#3c6b6b;border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:700;
  border:1px solid #dff0ee;
}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;background:#fff;padding:7px;border-radius:13px;box-shadow:var(--shadow);border:1px solid #eaf2f6}
.tab{
  border:none;background:transparent;padding:9px 15px;border-radius:9px;cursor:pointer;font-weight:700;
  font-size:12.8px;color:var(--muted);white-space:nowrap;transition:.16s;
}
.tab:hover{background:#f2f9f9;color:var(--text)}
.tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 5px 14px rgba(15,155,142,.28)}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.info-item{background:#f8fcfd;border:1px solid #eaf3f6;border-radius:11px;padding:11px 13px}
.info-item span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.info-item b{font-size:13.5px;font-weight:700}

/* ============ Timeline ============ */
.timeline{position:relative;padding-right:26px}
.timeline::before{content:'';position:absolute;right:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(#cdeae6,#eaf4f6)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{
  position:absolute;right:-26px;top:2px;width:22px;height:22px;border-radius:50%;background:#fff;
  border:2px solid var(--primary-2);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;
}
.tl-body{background:#f8fcfd;border:1px solid #eaf3f6;border-radius:11px;padding:10px 13px}
.tl-title{font-weight:800;font-size:13px}
.tl-desc{font-size:12.5px;color:#5b7480;margin-top:2px}
.tl-date{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:700}

/* ============ List items ============ */
.list-item{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #eaf3f6;border-radius:11px;background:#f9fdfd;margin-bottom:9px}
.list-item .li-main{flex:1;min-width:0}
.list-item .li-title{font-weight:800;font-size:13.5px}
.list-item .li-sub{font-size:12.5px;color:#5b7480;margin-top:2px;white-space:pre-wrap}
.list-item .li-date{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}

/* ============ Modal ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(12,40,48,.48);backdrop-filter:blur(3px);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,30,40,.35);animation:pop .22s ease;
}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15.5px;font-weight:800}
.modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;gap:10px;justify-content:flex-start;padding:14px 20px;border-top:1px solid var(--border);background:#fafdfe;border-radius:0 0 18px 18px}

/* ============ Toast ============ */
#toastRoot{position:fixed;bottom:22px;left:22px;z-index:500;display:flex;flex-direction:column;gap:9px}
.toast{
  background:#123c45;color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;
  box-shadow:0 10px 30px rgba(0,30,40,.3);animation:slideIn .25s ease;
}
.toast.ok{background:linear-gradient(135deg,#199e6f,#25a86b)}
.toast.err{background:linear-gradient(135deg,#c0392b,#e2504c)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* ============ Misc ============ */
.form-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.row-actions-wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.danger-zone{border:1.5px solid #f7d7d5;background:#fffafa}
.switch-row{display:flex;align-items:center;gap:12px;font-weight:700;font-size:13.5px;margin-bottom:14px;flex-wrap:wrap}
.switch{position:relative;display:inline-block;width:50px;height:27px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#d5e3e8;border-radius:30px;transition:.22s}
.slider:before{content:'';position:absolute;height:21px;width:21px;right:3px;bottom:3px;background:#fff;border-radius:50%;transition:.22s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:linear-gradient(135deg,var(--primary),var(--primary-2))}
.switch input:checked + .slider:before{transform:translateX(-23px)}
.attach-link{display:inline-flex;align-items:center;gap:5px;color:var(--primary-dark);font-weight:700;font-size:12.5px;background:#eaf6f4;padding:4px 10px;border-radius:8px}
.file-btn{position:relative;overflow:hidden}
.report-frame{background:#fff;border-radius:12px;padding:8px;border:1px solid var(--border)}
</style>
</head>
<body>

<!-- ==================== شاشة الإعداد الأولي ==================== -->
<div id="setupScreen" class="auth-wrap hidden">
  <div class="auth-card">
    <div class="auth-logo">✚</div>
    <h1>إعداد المنظومة لأول مرة</h1>
    <p class="auth-sub">أدخل بيانات العيادة وحساب الدخول للبدء</p>
    <form id="setupForm" class="auth-form" data-form="setup">
      <label class="field"><span>اسم العيادة</span>
        <input id="suClinic" name="clinicName" required placeholder="مثال: عيادة النور للعناية بالجسم">
      </label>
      <label class="field"><span>اسم المستخدم</span>
        <input id="suUser" name="username" required autocomplete="username" placeholder="اسم حساب الدخول">
      </label>
      <label class="field"><span>كلمة المرور</span>
        <input id="suPass" name="password" type="password" required minlength="4" autocomplete="new-password">
      </label>
      <label class="field"><span>تأكيد كلمة المرور</span>
        <input id="suPass2" name="password2" type="password" required autocomplete="new-password">
      </label>
      <div class="auth-err" id="suErr"></div>
      <button class="btn primary block" type="submit">إنشاء وحفظ</button>
    </form>
    <p class="auth-note">تُحفظ البيانات محلياً داخل هذا المتصفح بشكل آمن.</p>
  </div>
</div>

<!-- ==================== شاشة تسجيل الدخول ==================== -->
<div id="loginScreen" class="auth-wrap hidden">
  <div class="auth-card">
    <div class="auth-logo">✚</div>
    <h1 id="loginClinicName">تسجيل الدخول</h1>
    <p class="auth-sub">أدخل بيانات حسابك للوصول إلى المنظومة</p>
    <form id="loginForm" class="auth-form" data-form="login">
      <label class="field"><span>اسم المستخدم</span>
        <input id="loginUser" name="username" required autocomplete="username">
      </label>
      <label class="field"><span>كلمة المرور</span>
        <input id="loginPass" name="password" type="password" required autocomplete="current-password">
      </label>
      <div class="auth-err" id="loginErr"></div>
      <button class="btn primary block" type="submit">دخول</button>
    </form>
    <p class="auth-note">منظومة إدارة العيادات والمرضى</p>
  </div>
</div>

<!-- ==================== التطبيق ==================== -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">✚</div>
      <div>
        <div class="brand-name" id="brandClinic">العيادة</div>
        <div class="brand-sub">نظام إدارة العيادة</div>
      </div>
    </div>
    <nav class="nav" id="navMenu"></nav>
    <div class="sidebar-footer">النسخة 1.0 — تخزين محلي آمن</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="القائمة">☰</button>
      <div class="topbar-title" id="pageTitle">لوحة التحكم</div>
      <span class="topbar-user" id="topbarUser"></span>
      <button class="btn ghost sm" data-act="logout">تسجيل الخروج</button>
    </header>
    <main id="content"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =========================================================
   1) أدوات مساعدة عامة
   ========================================================= */
function el(id){ return document.getElementById(id); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function firstOfMonthISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; }
function fmtDate(iso){
  if(!iso) return '—';
  const parts = String(iso).split('-');
  if(parts.length!==3) return iso;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}
function fmtDT(ts){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} - ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function v(x){ return (x===null||x===undefined||x==='')?'—':esc(x); }
function num(val){ const n = parseFloat(val); return isNaN(n)?null:n; }
function toast(msg, type='ok'){
  const d = document.createElement('div');
  d.className = 'toast ' + type;
  d.textContent = msg;
  el('toastRoot').appendChild(d);
  setTimeout(()=>{ d.classList.add('out'); setTimeout(()=>d.remove(),320); }, 2600);
}
function readFileAsDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
    r.readAsDataURL(file);
  });
}

/* =========================================================
   3) التخزين (IndexedDB مع بديل localStorage)
   ========================================================= */
const DB_NAME='clinic_db_v1', STORE='kv', KEY='appstate';
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    let req;
    try { req = indexedDB.open(DB_NAME,1); }
    catch(e){ reject(e); return; }
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
    };
    req.onsuccess = e=>resolve(e.target.result);
    req.onerror = e=>reject(e.target.error);
  });
  return dbPromise;
}
async function idbSet(key, val){
  try{
    const db = await openDB();
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).put(val,key);
      tx.oncomplete = ()=>res(true);
      tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){
    console.warn('IndexedDB غير متاح، سيتم استخدام localStorage', e);
    try{ localStorage.setItem('clinic_fb_'+key, JSON.stringify(val)); }catch(_){}
  }
}
async function idbGet(key){
  try{
    const db = await openDB();
    return await new Promise((res,rej)=>{
      const tx = db.transaction(STORE,'readonly');
      const rq = tx.objectStore(STORE).get(key);
      rq.onsuccess = ()=>res(rq.result);
      rq.onerror = ()=>rej(rq.error);
    });
  }catch(e){
    const raw = localStorage.getItem('clinic_fb_'+key);
    return raw ? JSON.parse(raw) : undefined;
  }
}

   5) التشفير وكلمة المرور
   ========================================================= */
function randomSalt(){
  const a = new Uint8Array(16);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for(let i=0;i<16;i++) a[i] = Math.floor(Math.random()*256);
  return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function simpleHash(str){
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for(let i=0;i<str.length;i++){
    const c = str.charCodeAt(i);
    h1 = ((h1 ^ c) * 16777619) >>> 0;
    h2 = ((h2 * 31) + c) >>> 0;
  }
  return h1.toString(16) + h2.toString(16);
}
async function hashPass(pass, salt){
  const data = salt + '::' + pass;
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    try{
      const buf = new TextEncoder().encode(data);
      const h = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){ /* fall through */ }
  }
  return 'fb_' + simpleHash(data);
}

function openModal(opts){
  const root = el('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal ${opts.wide?'wide':''}">
        <div class="modal-head">
          <h3>${esc(opts.title||'')}</h3>

        </div>
        <div class="modal-body">${opts.body||''}</div>
        <div class="modal-foot">
          <button type="button" class="btn primary" id="modalOkBtn">${esc(opts.okText||'حفظ')}</button>
          <button type="button" class="btn ghost" data-act="close-modal">إلغاء</button>
        </div>
      </div>
    </div>`;
  el('modalOkBtn').onclick = async ()=>{
    let ok = true;
    try { ok = opts.onOk ? await opts.onOk() : true; }
    catch(err){ console.error(err); toast('حدث خطأ أثناء الحفظ','err'); ok = false; }
    if(ok === false) return;
    closeModal();
  };
  el('modalOverlay').addEventListener('mousedown', e=>{
    if(e.target.id === 'modalOverlay') closeModal();
  });
  const first = root.querySelector('input:not([type=file]),select,textarea');
  if(first) setTimeout(()=>first.focus(), 60);
  if(opts.onMount) opts.onMount();
}
function closeModal(){ el('modalRoot').innerHTML = ''; }

function modalValues(){
  const out = {};
  el('modalRoot').querySelectorAll('input,select,textarea').forEach(i=>{
    if(!i.name) return;
    if(i.type === 'file') return;
    if(i.type === 'checkbox') out[i.name] = i.checked;
    else if(i.type === 'number') out[i.name] = (i.value === '' ? null : Number(i.value));
    else out[i.name] = (typeof i.value === 'string' ? i.value.trim() : i.value);
  });
  return out;
}

/* حقل نموذج */
function f(label, name, opts){
  opts = opts || {};
  const type = opts.type || 'text';
  const value = (opts.value === undefined || opts.value === null) ? '' : opts.value;
  const req = opts.required ? 'required' : '';
  const ph = opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : '';
  let input;
  if(opts.options){
    input = `<select name="${name}" ${req}>${opts.options.map(o=>{
      const ov = (o && o.v !== undefined) ? o.v : o;
      const ot = (o && o.t !== undefined) ? o.t : o;
      return `<option value="${esc(ov)}" ${String(value)===String(ov)?'selected':''}>${esc(ot)}</option>`;
    }).join('')}</select>`;
  } else if(opts.rows){
    input = `<textarea name="${name}" rows="${opts.rows}" ${req} ${ph}>${esc(value)}</textarea>`;
  } else {
    input = `<input type="${type}" name="${name}" value="${esc(value)}" ${req} ${ph}
      ${opts.step?`step="${opts.step}"`:''} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.max!==undefined?`max="${opts.max}"`:''}>`;
  }
  return `<label class="field"><span>${esc(label)}</span>${input}${opts.hint?`<small class="hint">${esc(opts.hint)}</small>`:''}</label>`;
}

      <button class="btn primary" data-act="nav" data-view="newpatient">${icon('plus',17)} إضافة مريض جديد</button>
    </div>
    <div class="card toolbar">
      <div class="search-box">${icon('search',17)}<input id="pSearch" placeholder="بحث بالاسم أو رقم الهاتف..." value="${esc(pFilters.q)}"></div>
      <select id="pGender">
        <option value="">كل الأجناس</option>
        <option value="أنثى">أنثى</option>
        <option value="ذكر">ذكر</option>
      </select>
      <select id="pSort">
        <option value="name">الاسم (أ - ي)</option>
        <option value="name-desc">الاسم (ي - أ)</option>
        <option value="newest">الأحدث تسجيلاً</option>
        <option value="oldest">الأقدم تسجيلاً</option>
      </select>
      <input type="date" id="pFrom" title="من تاريخ التسجيل">
      <input type="date" id="pTo" title="إلى تاريخ التسجيل">
      <button class="btn ghost" data-act="reset-filters">إعادة تعيين</button>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th>م</th><th>اسم المريض</th><th>العمر</th><th>الجنس</th><th>الهاتف</th>
            <th>تاريخ التسجيل</th><th>الجلسات</th><th>الإجراءات</th>
          </tr></thead>
          <tbody id="patientsBody"></tbody>
        </table>
      </div>
      <div id="patientsEmpty" class="empty hidden">لا يوجد مرضى مطابقون للبحث</div>
    </div>
  `;
  el('pGender').value = pFilters.gender;
  el('pSort').value = pFilters.sort;
  el('pFrom').value = pFilters.from;
  el('pTo').value = pFilters.to;
  el('pSearch').oninput = e=>{ pFilters.q = e.target.value; drawPatients(); };
  el('pGender').onchange = e=>{ pFilters.gender = e.target.value; drawPatients(); };
  el('pSort').onchange = e=>{ pFilters.sort = e.target.value; drawPatients(); };
  el('pFrom').onchange = e=>{ pFilters.from = e.target.value; drawPatients(); };
  el('pTo').onchange = e=>{ pFilters.to = e.target.value; drawPatients(); };
  drawPatients();
}
function drawPatients(){
  const q = pFilters.q.trim().toLowerCase();
  let list = state.patients.filter(p=>{
    if(q){
      const nm = (p.name||'').toLowerCase();
      const ph = (p.phone||'');
      if(!nm.includes(q) && !ph.includes(q)) return false;
    }
    if(pFilters.gender && p.gender !== pFilters.gender) return false;
    if(pFilters.from && (p.regDate||'') < pFilters.from) return false;
    if(pFilters.to && (p.regDate||'') > pFilters.to) return false;
    return true;
  });
  if(pFilters.sort === 'name') list.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
  else if(pFilters.sort === 'name-desc') list.sort((a,b)=>(b.name||'').localeCompare(a.name||'','ar'));
  else if(pFilters.sort === 'newest') list.sort((a,b)=>(b.regDate||'').localeCompare(a.regDate||''));
  else if(pFilters.sort === 'oldest') list.sort((a,b)=>(a.regDate||'').localeCompare(b.regDate||''));

  const body = el('patientsBody');
  const empty = el('patientsEmpty');
  if(!list.length){
    body.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  body.innerHTML = list.map((p,i)=>`
    <tr>
      <td>${i+1}</td>
      <td><a data-act="open-patient" data-pid="${p.id}" style="color:var(--primary-dark);font-weight:800">${esc(p.name)}</a></td>
      <td>${v(p.age)}</td>
      <td>${v(p.gender)}</td>
      <td>${v(p.phone)}</td>
      <td>${fmtDate(p.regDate)}</td>
      <td>${(p.sessions||[]).length}</td>
      <td>
        <div class="row-actions">
          <button class="icon-btn" title="فتح الملف" data-act="open-patient" data-pid="${p.id}">${icon('eye',16)}</button>
          <button class="icon-btn" title="تعديل" data-act="edit-patient" data-pid="${p.id}">${icon('edit',16)}</button>
          <button class="icon-btn danger" title="حذف" data-act="del-patient" data-pid="${p.id}">${icon('trash',16)}</button>
        </div>
      </td>
    </tr>`).join('');
}

      </div>
      <button class="btn ghost" data-act="nav" data-view="patients">${icon('back',16)} رجوع للقائمة</button>
    </div>
    <form class="card" data-form="patient" data-pid="${p?p.id:''}">
      <h3 class="sec-title">البيانات الشخصية</h3>
      <div class="grid3">
        ${f('اسم المريض *','name',{value:p?p.name:'',required:true,placeholder:'الاسم الكامل'})}
        ${f('العمر (سنة)','age',{type:'number',value:p?p.age:'',min:0,max:120})}
        ${f('الجنس','gender',{options:['أنثى','ذكر'],value:p?p.gender:'أنثى'})}
        ${f('رقم الهاتف','phone',{value:p?p.phone:'',placeholder:'مثال: 01000000000'})}
        ${f('تاريخ التسجيل','regDate',{type:'date',value:p?p.regDate:todayISO(),required:true})}
      </div>

      ${!p ? `
      <h3 class="sec-title" style="margin-top:22px">القياسات الجسدية (اختياري)</h3>
      <div class="grid3">
        ${f('الطول (سم)','height',{type:'number',step:'0.1',min:0})}
        ${f('الوزن (كجم)','weight',{type:'number',step:'0.1',min:0})}
        ${f('مؤشر كتلة الجسم BMI','bmi',{type:'number',step:'0.1',hint:'يُحسب تلقائياً'})}
        ${f('نسبة الدهون %','bodyFat',{type:'number',step:'0.1',min:0})}
        ${f('كتلة العضلات (كجم)','muscle',{type:'number',step:'0.1',min:0})}
        ${f('نسبة الماء %','water',{type:'number',step:'0.1',min:0})}
        ${f('الدهون الحشوية','visceral',{type:'number',step:'0.1',min:0})}
        ${f('معدل الأيض الأساسي BMR','bmr',{type:'number',step:'1',min:0})}
        ${f('تاريخ القياس','mDate',{type:'date',value:todayISO()})}
      </div>

      <h3 class="sec-title" style="margin-top:22px">التشخيص الطبي</h3>
      <label class="field"><textarea name="diagnosis" rows="3" placeholder="وصف الحالة الصحية أو المشكلة التي يعاني منها المريض..."></textarea></label>

      <h3 class="sec-title" style="margin-top:22px">الخطة العلاجية</h3>
      <label class="field"><textarea name="treatment" rows="3" placeholder="العلاج أو الخطة العلاجية المحددة للمريض..."></textarea></label>
      ` : `
      <div class="info-item" style="margin-top:20px">
        <span>ملاحظة</span>
        <b style="font-weight:600;font-size:12.8px">لتعديل القياسات والتحاليل والجلسات والعلاجات، افتح ملف المريض من زر «فتح الملف».</b>
      </div>
      `}

      <div class="form-actions">
        <button class="btn primary" type="submit">${p?'حفظ التعديلات':'حفظ المريض'}</button>
        <button class="btn ghost" type="button" data-act="nav" data-view="patients">إلغاء</button>
      </div>
    </form>
  `;
  // حساب BMI تلقائياً
  const hIn = document.querySelector('#content input[name="height"]');
  const wIn = document.querySelector('#content input[name="weight"]');
  const bIn = document.querySelector('#content input[name="bmi"]');
  if(hIn && wIn && bIn){
    const calc = ()=>{
      const h = parseFloat(hIn.value), w = parseFloat(wIn.value);
      if(h>0 && w>0) bIn.value = (w / Math.pow(h/100,2)).toFixed(1);
    };
    hIn.addEventListener('input', calc);
    wIn.addEventListener('input', calc);
  }
}

function openPatient(id){
  currentPatientId = id;
  profTab = 'overview';
  navigate('patient');
}
function latestMeasurement(p){
  const arr = (p.measurements||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return arr[0] || null;
}
function renderPatientProfile(id){
  const p = P(id);

  const tabs = [

    ['treatments','العلاجات'],['injections','الحقن'],['sessions','الجلسات'],
    ['procedures','الإجراءات'],['notes','الملاحظات'],['timeline','السجل الزمني']
  ];
  el('content').innerHTML = `
    <div class="page-head">

          <h2>${esc(p.name)}</h2>

      </div>

function switchProfTab(tab){
  profTab = tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab === tab));
  const p = P(currentPatientId);
  if(p) el('tabBody').innerHTML = renderProfileTab(p, tab);
}
function renderProfileTab(p, tab){
  switch(tab){
    case 'overview': return tabOverview(p);
    case 'measurements': return tabMeasurements(p);
    case 'tests': return tabTests(p);
    case 'treatments': return tabTreatments(p);
    case 'injections': return tabInjections(p);
    case 'sessions': return tabSessions(p);
    case 'procedures': return tabProcedures(p);
    case 'notes': return tabNotes(p);
    case 'timeline': return tabTimeline(p);
    default: return tabOverview(p);
  }
}

function buildTimeline(p){
  const ev = [];
  ev.push({ date:p.regDate, icon:'users', title:'تسجيل المريض لأول مرة', desc:'تم إنشاء الملف الطبي' });
  (p.measurements||[]).forEach(m=>ev.push({
    date:m.date, icon:'chart', title:'تسجيل قياسات جديدة',
    desc:`الوزن: ${m.weight??'—'} كجم • الطول: ${m.height??'—'} سم • BMI: ${m.bmi??'—'}`
  }));
  (p.tests||[]).forEach(t=>ev.push({ date:t.date, icon:'flask', title:'تحليل طبي: '+t.name, desc:`النتيجة: ${t.result??'—'} ${t.unit||''}` }));
  (p.treatments||[]).forEach(t=>ev.push({ date:t.date, icon:'pill', title:'تحديث الخطة العلاجية', desc:t.text }));
  ((p.mounjaro&&p.mounjaro.doses)||[]).forEach(d=>ev.push({ date:d.date, icon:'syringe', title:'جرعة مونجارو', desc:`الجرعة: ${d.dose||'—'} ${d.notes?('• '+d.notes):''}` }));
  (p.sessions||[]).forEach(s=>ev.push({ date:s.date, icon:'device', title:`جلسة ${s.device} رقم ${s.sessionNo||''}`, desc:`المنطقة: ${s.area||'—'} • المدة: ${s.duration||'—'} دقيقة` }));
  (p.procedures||[]).forEach(x=>ev.push({ date:x.date, icon:'note', title:'إجراء: '+x.name, desc:x.notes||'' }));
  (p.notes||[]).forEach(n=>ev.push({ date:n.date, icon:'note', title:'ملاحظة المختص', desc:n.text }));
  ev.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  return ev;
}
function tabTimeline(p){
  const ev = buildTimeline(p);
  return `<div class="card">
    <h3 class="card-title">السجل الزمني الكامل (${ev.length} حدث)</h3>
    ${ev.length ? `<div class="timeline">${ev.map(e=>`

        <div class="tl-body">

function measurementModal(pid){

    body:`<div class="grid3">
      ${f('تاريخ القياس','date',{type:'date',value:todayISO(),required:true})}
      ${f('الطول (سم)','height',{type:'number',step:'0.1',min:0})}
      ${f('الوزن (كجم)','weight',{type:'number',step:'0.1',min:0})}
      ${f('مؤشر كتلة الجسم BMI','bmi',{type:'number',step:'0.1'})}
      ${f('نسبة الدهون %','bodyFat',{type:'number',step:'0.1',min:0})}
      ${f('كتلة العضلات (كجم)','muscle',{type:'number',step:'0.1',min:0})}
      ${f('نسبة الماء %','water',{type:'number',step:'0.1',min:0})}
      ${f('الدهون الحشوية','visceral',{type:'number',step:'0.1',min:0})}
      ${f('معدل الأيض الأساسي BMR','bmr',{type:'number',step:'1',min:0})}
    </div>`,
    onMount(){
      const h = el('modalRoot').querySelector('[name=height]');
      const w = el('modalRoot').querySelector('[name=weight]');
      const b = el('modalRoot').querySelector('[name=bmi]');
      const calc = ()=>{ const hv=parseFloat(h.value), wv=parseFloat(w.value); if(hv>0&&wv>0) b.value=(wv/Math.pow(hv/100,2)).toFixed(1); };
      h.addEventListener('input', calc); w.addEventListener('input', calc);
    },
    onOk(){
      const vv = modalValues();
      if(!vv.date){ toast('تاريخ القياس مطلوب','err'); return false; }
      const rec = { id:uid(), date:vv.date, height:vv.height, weight:vv.weight, bmi:vv.bmi,
        bodyFat:vv.bodyFat, muscle:vv.muscle, water:vv.water, visceral:vv.visceral, bmr:vv.bmr };
      p.measurements.push(rec);
      logActivity('measurement', `تسجيل قياسات جديدة للمريض ${p.name}`);
      save(); renderPatientProfile(p.id); toast('تم حفظ القياسات');
    }
  });
}

function testModal(pid, testId){
  const p = P(pid); if(!p) return;
  const t = testId ? (p.tests||[]).find(x=>x.id===testId) : null;
  openModal({
    title: t ? 'تعديل التحليل' : 'إضافة تحليل طبي', wide:true, okText:'حفظ التحليل',
    body:`<div class="grid2">
      ${f('اسم التحليل *','name',{value:t?t.name:'',required:true,placeholder:'مثال: صورة دم كاملة'})}
      ${f('تاريخ إجراء التحليل *','date',{type:'date',value:t?t.date:todayISO(),required:true})}
      ${f('النتيجة','result',{value:t?t.result:''})}
      ${f('الوحدة المستخدمة','unit',{value:t?t.unit:''})}
      ${f('المعدل المرجعي الطبيعي','refRange',{value:t?t.refRange:''})}
      ${f('ملاحظات المختص','notes',{value:t?t.notes:''})}
    </div>
    <label class="field"><span>إرفاق صورة أو ملف PDF (اختياري — حتى 3 ميجابايت)</span>
      <input type="file" name="file" accept="image/*,application/pdf">
    </label>
    ${t&&t.fileName?`<p class="muted small">المرفق الحالي: ${esc(t.fileName)}</p>`:''}`,
    async onOk(){
      const vv = modalValues();
      if(!vv.name || !vv.date){ toast('اسم التحليل والتاريخ مطلوبان','err'); return false; }
      let fileData = t?t.fileData:null, fileName = t?t.fileName:null;
      const fi = el('modalRoot').querySelector('input[name=file]');
      if(fi && fi.files && fi.files[0]){
        const fl = fi.files[0];
        if(fl.size > 3*1024*1024){ toast('حجم الملف كبير (الحد 3 ميجابايت)','err'); return false; }
        fileData = await readFileAsDataURL(fl);
        fileName = fl.name;
      }
      if(t){
        Object.assign(t, { name:vv.name, date:vv.date, result:vv.result, unit:vv.unit, refRange:vv.refRange, notes:vv.notes, fileData, fileName });
        logActivity('test', `تحديث تحليل «${vv.name}» للمريض ${p.name}`);
      } else {
        p.tests.push({ id:uid(), name:vv.name, date:vv.date, result:vv.result, unit:vv.unit, refRange:vv.refRange, notes:vv.notes, fileData, fileName });
        logActivity('test', `إضافة تحليل «${vv.name}» للمريض ${p.name}`);
      }
      save(); renderPatientProfile(p.id); toast('تم حفظ التحليل');
    }
  });

let sFilter = { device:'', q:'' };
function renderSessions(){
  const all = allSessions();
  const counts = {};
  DEVICES.forEach(d=>counts[d]=0);
  all.forEach(s=>counts[s.device]=(counts[s.device]||0)+1);
  el('content').innerHTML = `
    <div class="page-head">
      <div><h2>الجلسات والأجهزة</h2><p>سجل جميع جلسات الأجهزة والإجراءات التجميلية</p></div>
      <button class="btn primary" data-act="add-session-global">${icon('plus',17)} تسجيل جلسة جديدة</button>
    </div>
    <div class="stats-row" style="margin-bottom:18px">
      ${DEVICES.map(d=>`<div class="mstat"><b>${counts[d]}</b><span>${esc(d)}</span></div>`).join('')}
    </div>
    <div class="card toolbar">
      <div class="search-box">${icon('search',17)}<input id="sSearch" placeholder="بحث باسم المريض..." value="${esc(sFilter.q)}"></div>
      <select id="sDevice">
        <option value="">كل الأجهزة</option>
        ${DEVICES.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('')}
      </select>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>التاريخ</th><th>المريض</th><th>الجهاز</th><th>رقم الجلسة</th><th>المنطقة</th><th>المدة</th><th>الموظف</th><th>ملاحظات</th></tr></thead>
          <tbody id="sessionsBody"></tbody>
        </table>
      </div>
      <div id="sessionsEmpty" class="empty hidden">لا توجد جلسات مطابقة</div>
    </div>
  `;
  el('sDevice').value = sFilter.device;
  el('sSearch').oninput = e=>{ sFilter.q = e.target.value; drawSessions(); };
  el('sDevice').onchange = e=>{ sFilter.device = e.target.value; drawSessions(); };
  drawSessions();
}
function drawSessions(){
  const q = sFilter.q.trim().toLowerCase();
  let list = allSessions().filter(s=>{
    if(sFilter.device && s.device !== sFilter.device) return false;
    if(q && !(s.patientName||'').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const body = el('sessionsBody'), empty = el('sessionsEmpty');
  if(!list.length){ body.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  body.innerHTML = list.map(s=>`<tr>
    <td>${fmtDate(s.date)}</td>
    <td><a data-act="open-patient" data-pid="${s.pid}" style="color:var(--primary-dark);font-weight:800">${esc(s.patientName)}</a></td>
    <td>${esc(s.device)}</td>
    <td>${v(s.sessionNo)}</td>
    <td>${v(s.area)}</td>
    <td>${v(s.duration)}</td>
    <td>${v(s.staff)}</td>
    <td style="max-width:180px">${v(s.notes)}</td>
  </tr>`).join('');
}

function inRange(date, from, to){
  if(!date) return false;
  if(from && date < from) return false;
  if(to && date > to) return false;
  return true;
}
function buildTable(headers, rows){
  return `<div class="table-wrap"><table class="table">
    <thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.length
      ? rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${headers.length}" class="empty">لا توجد بيانات في هذه الفترة</td></tr>`}</tbody>
  </table></div>`;
}
function generateReport(){
  const type = el('rType').value;
  const from = el('rFrom').value;
  const to = el('rTo').value;
  reportState.type = type; reportState.from = from; reportState.to = to;
  let title = '', headers = [], rows = [];

  if(type === 'patients'){
    title = 'تقرير إجمالي المرضى';
    headers = ['م','اسم المريض','العمر','الجنس','الهاتف','تاريخ التسجيل','الجلسات','التحاليل'];
    const list = state.patients.filter(p=>inRange(p.regDate, from, to));
    rows = list.map((p,i)=>[i+1, esc(p.name), v(p.age), v(p.gender), v(p.phone), fmtDate(p.regDate), (p.sessions||[]).length, (p.tests||[]).length]);
  }
  else if(type === 'sessions'){
    title = 'تقرير الجلسات خلال الفترة';
    headers = ['التاريخ','المريض','الجهاز','رقم الجلسة','المنطقة','المدة','الموظف'];
    const list = allSessions().filter(s=>inRange(s.date, from, to)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    rows = list.map(s=>[fmtDate(s.date), esc(s.patientName), esc(s.device), v(s.sessionNo), v(s.area), v(s.duration), v(s.staff)]);
  }
  else if(type === 'byDevice'){
    title = 'تقرير عدد الجلسات لكل جهاز';
    headers = ['الجهاز / الإجراء','عدد الجلسات'];
    const list = allSessions().filter(s=>inRange(s.date, from, to));
    const counts = {};
    DEVICES.forEach(d=>counts[d]=0);
    list.forEach(s=>counts[s.device]=(counts[s.device]||0)+1);
    rows = DEVICES.map(d=>[esc(d), counts[d]]);
  }
  else if(type === 'newPatients'){
    title = 'تقرير المرضى الجدد';
    headers = ['م','اسم المريض','الهاتف','الجنس','تاريخ التسجيل'];
    const list = state.patients.filter(p=>inRange(p.regDate, from, to));
    rows = list.map((p,i)=>[i+1, esc(p.name), v(p.phone), v(p.gender), fmtDate(p.regDate)]);
  }
  else if(type === 'tests'){
    title = 'تقرير التحاليل المسجلة';
    headers = ['التاريخ','المريض','اسم التحليل','النتيجة','الوحدة','المعدل المرجعي'];
    const list = allTests().filter(t=>inRange(t.date, from, to)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    rows = list.map(t=>[fmtDate(t.date), esc(t.patientName), esc(t.name), v(t.result), v(t.unit), v(t.refRange)]);
  }
  else if(type === 'treatments'){
    title = 'تقرير العلاجات والإجراءات';
    headers = ['التاريخ','المريض','النوع','التفاصيل'];
    const rowsArr = [];
    state.patients.forEach(p=>{
      (p.treatments||[]).forEach(t=>{ if(inRange(t.date,from,to)) rowsArr.push([t.date, p.name, 'علاج', t.text]); });
      (p.procedures||[]).forEach(x=>{ if(inRange(x.date,from,to)) rowsArr.push([x.date, p.name, 'إجراء', x.name + (x.notes?(' — '+x.notes):'')]); });
      (p.sessions||[]).forEach(s=>{ if(inRange(s.date,from,to)) rowsArr.push([s.date, p.name, 'جلسة جهاز', s.device + ' رقم ' + (s.sessionNo||'—')]); });
      ((p.mounjaro&&p.mounjaro.doses)||[]).forEach(d=>{ if(inRange(d.date,from,to)) rowsArr.push([d.date, p.name, 'جرعة مونجارو', d.dose||'—']); });
    });
    rowsArr.sort((a,b)=>(a[0]||'').localeCompare(b[0]||''));
    rows = rowsArr.map(r=>[fmtDate(r[0]), esc(r[1]), esc(r[2]), esc(r[3])]);
  }

  reportState.title = title;
  reportState.html = `
    <div style="padding:10px 6px 4px">
      <h3 style="font-size:16px;font-weight:800;margin-bottom:4px">${esc(state.settings.clinicName||'العيادة')}</h3>
      <p style="font-size:12.5px;color:#7a8b9a;margin-bottom:12px">
        ${esc(title)} — الفترة من ${fmtDate(from)} إلى ${fmtDate(to)} — تاريخ الإصدار: ${fmtDate(todayISO())}
      </p>
      ${buildTable(headers, rows)}
      <p style="font-size:12px;color:#7a8b9a;margin-top:12px">عدد السجلات: ${rows.length}</p>
    </div>`;
  el('reportResult').innerHTML = reportState.html;
  toast('تم توليد التقرير');
}
function printReport(){
  if(!reportState.html){ toast('قم بتوليد التقرير أولاً','err'); return; }

function exportBackup(){
  try{
    const data = JSON.stringify(state, null, 2);
    const blob = new Blob([data], { type:'application/json;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `clinic-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('تم تصدير النسخة الاحتياطية');
  }catch(e){ console.error(e); toast('تعذر تصدير النسخة','err'); }
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data || typeof data !== 'object' || !Array.isArray(data.patients)) throw new Error('bad');
      let addedPatients = 0, addedActivities = 0;
      const existing = new Set(state.patients.map(p=>p.id));
      data.patients.forEach(p=>{
        if(p && p.id && !existing.has(p.id)){
          state.patients.push(normalizePatient(p));
          existing.add(p.id);
          addedPatients++;
        }
      });
      const exAct = new Set(state.activities.map(a=>a.id));
      (data.activities||[]).forEach(a=>{
        if(a && a.id && !exAct.has(a.id)){ state.activities.push(a); exAct.add(a.id); addedActivities++; }
      });
      // استعادة الإعدادات فقط إذا لم تكن المنظومة مهيأة
      if(!state.settings.setupDone && data.settings && data.settings.setupDone){
        state.settings = Object.assign({}, state.settings, data.settings);
      }
      state.activities.sort((a,b)=>b.ts-a.ts);
      save();
      toast(`تم الاستيراد: ${addedPatients} مريض جديد، ${addedActivities} نشاط`);
      renderSettings();
    }catch(err){
      console.error(err);
      toast('ملف النسخة الاحتياطية غير صالح','err');
    }
  };
  reader.onerror = ()=>toast('تعذر قراءة الملف','err');
  reader.readAsText(file);
}
async function resetData(){
  if(!confirm('تحذير: سيتم حذف جميع بيانات المرضى والسجلات والإعدادات نهائياً. هل تريد المتابعة؟')) return;
  if(!confirm('تأكيد نهائي: هل أنت متأكد من حذف كل البيانات؟')) return;
  state = defaultState();
  await idbSet(KEY, state);
  sessionStorage.removeItem('clinicAuth');
  toast('تم حذف جميع البيانات');
  setTimeout(()=>location.reload(), 700);
}

/* =========================================================
   18) معالجة النماذج
   ========================================================= */
async function handleForm(name, form){
  if(name === 'setup'){
    const clinicName = el('suClinic').value.trim();
    const username = el('suUser').value.trim();
    const pass = el('suPass').value;
    const pass2 = el('suPass2').value;
    const err = el('suErr');
    err.textContent = '';
    if(!clinicName || !username){ err.textContent = 'يرجى إدخال اسم العيادة واسم المستخدم'; return; }
    if(pass.length < 4){ err.textContent = 'كلمة المرور يجب أن تكون 4 أحرف على الأقل'; return; }
    if(pass !== pass2){ err.textContent = 'كلمتا المرور غير متطابقتين'; return; }
    const salt = randomSalt();
    const passHash = await hashPass(pass, salt);
    state.settings = { clinicName, username, passHash, salt, setupDone:true, createdAt: Date.now() };
    state.patients = [];
    state.activities = [];
    logActivity('system', 'تم تهيئة المنظومة وإنشاء حساب الدخول');
    await idbSet(KEY, state);
    toast('تم إنشاء المنظومة بنجاح');
    el('loginClinicName').textContent = clinicName;
    el('loginUser').value = username;
    el('loginPass').value = '';
    showScreen('loginScreen');
    return;
  }

  if(name === 'login'){
    const username = el('loginUser').value.trim();
    const pass = el('loginPass').value;
    const err = el('loginErr');
    err.textContent = '';
    if(!username || !pass){ err.textContent = 'يرجى إدخال اسم المستخدم وكلمة المرور'; return; }
    const h = await hashPass(pass, state.settings.salt || '');
    if(username !== state.settings.username || h !== state.settings.passHash){
      err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
      return;
    }
    sessionStorage.setItem('clinicAuth','1');
    startApp();
    toast('مرحباً ' + state.settings.username);
    return;
  }

  if(name === 'patient'){
    const pid = form.dataset.pid;
    const vv = modalValuesFromForm(form);
    if(!vv.name){ toast('اسم المريض مطلوب','err'); return; }
    if(pid){
      const p = P(pid);
      if(!p) return;
      p.name = vv.name;
      p.age = vv.age;
      p.gender = vv.gender;
      p.phone = vv.phone;
      p.regDate = vv.regDate || p.regDate;
      logActivity('patient', `تحديث بيانات المريض ${p.name}`);
      save();
      toast('تم حفظ التعديلات');
      openPatient(p.id);
    } else {
      const p = normalizePatient({
        id: uid(),
        name: vv.name, age: vv.age, gender: vv.gender, phone: vv.phone,
        regDate: vv.regDate || todayISO(), createdAt: Date.now(),
        diagnosis: (vv.diagnosis||'').trim()
      });
      if(vv.height || vv.weight || vv.bmi || vv.bodyFat || vv.muscle || vv.water || vv.visceral || vv.bmr){
        p.measurements.push({
          id:uid(), date: vv.mDate || todayISO(),
          height:vv.height, weight:vv.weight, bmi:vv.bmi, bodyFat:vv.bodyFat,
          muscle:vv.muscle, water:vv.water, visceral:vv.visceral, bmr:vv.bmr
        });
      }
      if((vv.treatment||'').trim()){
        p.treatments.push({ id:uid(), date: todayISO(), text: vv.treatment.trim() });
      }
      state.patients.push(p);
      logActivity('patient', `إضافة مريض جديد: ${p.name}`);
      save();
      toast('تم تسجيل المريض بنجاح');
      openPatient(p.id);
    }
    return;
  }

  if(name === 'clinic'){
    const vv = modalValuesFromForm(form);
    if(!vv.clinicName || !vv.username){ toast('جميع الحقول مطلوبة','err'); return; }
    state.settings.clinicName = vv.clinicName;
    state.settings.username = vv.username;
    el('brandClinic').textContent = vv.clinicName;
    el('topbarUser').textContent = 'مرحباً، ' + vv.username;
    logActivity('system', 'تحديث بيانات العيادة والحساب');
    save();
    toast('تم حفظ بيانات العيادة');
    return;
  }

  if(name === 'password'){
    const vv = modalValuesFromForm(form);
    if(!vv.current || !vv.newPass){ toast('جميع الحقول مطلوبة','err'); return; }
    const cur = await hashPass(vv.current, state.settings.salt || '');
    if(cur !== state.settings.passHash){ toast('كلمة المرور الحالية غير صحيحة','err'); return; }
    if(vv.newPass.length < 4){ toast('كلمة المرور الجديدة قصيرة جداً','err'); return; }
    if(vv.newPass !== vv.newPass2){ toast('كلمتا المرور الجديدتان غير متطابقتين','err'); return; }
    const salt = randomSalt();
    state.settings.salt = salt;
    state.settings.passHash = await hashPass(vv.newPass, salt);
    logActivity('system', 'تغيير كلمة المرور');
    save();
    form.reset();
    toast('تم تغيير كلمة المرور بنجاح');
    return;
  }
}
function modalValuesFromForm(form){
  const out = {};
  form.querySelectorAll('input,select,textarea').forEach(i=>{
    if(!i.name) return;
    if(i.type === 'checkbox') out[i.name] = i.checked;
    else if(i.type === 'number') out[i.name] = (i.value === '' ? null : Number(i.value));
    else out[i.name] = (typeof i.value === 'string' ? i.value.trim() : i.value);
  });
  return out;
}

document.addEventListener('submit', e=>{
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  handleForm(form.dataset.form, form).catch(err=>{ console.error(err); toast('حدث خطأ','err'); });
});

/* =========================================================
   19) معالجة النقرات (Event Delegation)
   ========================================================= */
function getPatientArray(p, type){
  if(type === 'doses') return p.mounjaro ? p.mounjaro.doses : [];
  return p[type] || [];
}

document.addEventListener('click', async e=>{
  const target = e.target.closest('[data-act]');
  if(!target) return;
  const act = target.dataset.act;
  const pid = target.dataset.pid;
  const id = target.dataset.id;
  const type = target.dataset.type;

  switch(act){
    case 'nav': navigate(target.dataset.view); break;
    case 'logout': logout(); break;
    case 'close-modal': closeModal(); break;

    case 'open-patient': openPatient(pid); break;
    case 'edit-patient': navigate('newpatient'); renderPatientForm(pid); break;
    case 'del-patient': {
      const p = P(pid); if(!p) break;
      if(confirm(`هل تريد حذف ملف المريض «${p.name}» وجميع سجلاته نهائياً؟`)){
        state.patients = state.patients.filter(x=>x.id !== pid);
        logActivity('patient', `حذف ملف المريض ${p.name}`);
        save();
        toast('تم حذف ملف المريض');
        navigate('patients');
      }
      break;
    }
    case 'prof-tab': switchProfTab(target.dataset.tab); break;

    case 'add-measurement': measurementModal(pid); break;
    case 'add-test': testModal(pid); break;
    case 'edit-test': testModal(pid, id); break;
    case 'add-treatment': treatmentModal(pid); break;
    case 'add-dose': doseModal(pid); break;
    case 'add-session': sessionModal(pid); break;
    case 'add-procedure': procedureModal(pid); break;
    case 'add-note': noteModal(pid); break;
    case 'edit-diagnosis': diagnosisModal(pid); break;

    case 'toggle-mounjaro': {
      const p = P(pid); if(!p) break;
      p.mounjaro = p.mounjaro || { enabled:false, startDate:'', doses:[] };
      p.mounjaro.enabled = !p.mounjaro.enabled;
      if(p.mounjaro.enabled && !p.mounjaro.startDate) p.mounjaro.startDate = todayISO();
      logActivity('dose', `${p.mounjaro.enabled?'تفعيل':'إيقاف'} علاج مونجارو للمريض ${p.name}`);
      save(); renderPatientProfile(p.id);
      toast(p.mounjaro.enabled ? 'تم تفعيل علاج مونجارو' : 'تم إيقاف علاج مونجارو');
      break;
    }

    case 'del-item': {
      const p = P(pid); if(!p) break;
      const arr = getPatientArray(p, type);
      const idx = arr.findIndex(x=>x.id === id);
      if(idx > -1 && confirm('هل تريد حذف هذا السجل نهائياً؟')){
        arr.splice(idx,1);
        save();
        renderPatientProfile(p.id);
        toast('تم حذف السجل');
      }
      break;
    }

    case 'reset-filters':
      pFilters = { q:'', gender:'', from:'', to:'', sort:'name' };
      renderPatients();
      break;

    case 'add-session-global': {
      if(!state.patients.length){ toast('لا يوجد مرضى مسجلون','err'); break; }
      openModal({
        title:'اختر المريض',
        body:`<label class="field"><span>المريض</span>
          <select id="pickPatient">${state.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
        </label>`,
        onOk(){
          const chosen = el('pickPatient').value;
          setTimeout(()=>sessionModal(chosen), 220);
        }
      });
      break;
    }
    case 'add-test-global': {
      if(!state.patients.length){ toast('لا يوجد مرضى مسجلون','err'); break; }
      openModal({
        title:'اختر المريض',
        body:`<label class="field"><span>المريض</span>
          <select id="pickPatient">${state.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
        </label>`,
        onOk(){
          const chosen = el('pickPatient').value;
          setTimeout(()=>testModal(chosen), 220);
        }
      });
      break;
    }
    case 'add-dose-global': {
      if(!state.patients.length){ toast('لا يوجد مرضى مسجلون','err'); break; }
      openModal({
        title:'اختر المريض',
        body:`<label class="field"><span>المريض</span>
          <select id="pickPatient">${state.patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
        </label>`,
        onOk(){
          const chosen = el('pickPatient').value;
          setTimeout(()=>doseModal(chosen), 220);
        }
      });
      break;
    }

    case 'generate-report': generateReport(); break;
    case 'print-report': printReport(); break;
    case 'export-backup': exportBackup(); break;
    case 'reset-data': resetData(); break;
  }
});

/* =========================================================
   20) التشغيل
   ========================================================= */
el('menuBtn').addEventListener('click', ()=>{
  el('sidebar').classList.toggle('open');
});

async function boot(){
  try{
    const saved = await idbGet(KEY);
    if(saved && saved.settings){
      state = Object.assign(defaultState(), saved);
      state.settings = Object.assign(defaultState().settings, saved.settings || {});
      state.patients = (saved.patients || []).map(normalizePatient);
      state.activities = saved.activities || [];
    }
  }catch(err){
    console.error('خطأ في تحميل البيانات', err);
  }
  el('loginClinicName').textContent = state.settings.clinicName || 'تسجيل الدخول';
  if(!state.settings.setupDone){
    showScreen('setupScreen');
  } else if(sessionStorage.getItem('clinicAuth') === '1'){
    startApp();
  } else {
    showScreen('loginScreen');
  }
}
boot();
</script>
